<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal</title>
  <link rel="stylesheet" href="patient.css">
</head>
<body>

  <!-- 1. Welcome / Home Screen -->
  <section id="welcome-screen" class="screen active">
    <div class="card">
      <h1>Welcome</h1>
      <p class="subtitle">A simple platform to support cognitive wellbeing.</p>
      <button id="btn-get-started" class="btn btn-primary">Get Started</button>
    </div>
  </section>

  <!-- 2. Login Screen -->
  <section id="login-screen" class="screen hidden">
    <div class="card">
      <h2>Welcome Back</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Name</label>
          <input type="text" id="username" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>
  </section>

  <!-- 3. Patient Dashboard Screen -->
  <section id="dashboard-screen" class="screen hidden">
    <header class="dashboard-header">
      <h1 id="user-greeting">👋 Welcome!</h1>
      <p class="subtitle">What would you like to do today?</p>
    </header>

    <div class="grid-container">
      <button class="nav-card" id="btn-games">
        <span class="icon">🧠</span>
        <span class="title">Games</span>
        <span class="desc">Play & train</span>
      </button>

      <button class="nav-card" id="btn-reminders">
        <span class="icon">🔔</span>
        <span class="title">Reminders</span>
        <span class="desc">Your tasks</span>
      </button>

      <button class="nav-card" id="btn-progress">
        <span class="icon">📊</span>
        <span class="title">Progress</span>
        <span class="desc">View growth</span>
      </button>
    </div>

    <button id="btn-logout" class="btn btn-secondary">🚪 Log Out</button>
  </section>

  <script src="patient.js"></script>
</body>
</html>
